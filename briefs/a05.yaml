id: A05
category: Campus Safety & Wellbeing
topic: Cyber safety - fake internship/job offers and digital arrest scams
audience: college students
format: video_9x16
duration_s: 48
tone: clear, practical, calm
language: English
must_include:
  - suspicious job or internship registration fee warning
